<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" role="img" aria-labelledby="title"><title id="title">Sampling distribution of six equally likely sample means: 3, 4, 5, 5, 6, 7. The dots at 6 and 7 are shaded.</title><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#3b5148;font-size:12px} .small{font-size:10px}</style><path d="M48 140H437" stroke="#9bada1"/><circle cx="65" cy="126" r="6" fill="#a8bbae"/><circle cx="150" cy="126" r="6" fill="#a8bbae"/><circle cx="235" cy="126" r="6" fill="#a8bbae"/><circle cx="235" cy="108" r="6" fill="#a8bbae"/><circle cx="320" cy="126" r="6" fill="#266c5c"/><circle cx="405" cy="126" r="6" fill="#266c5c"/><path d="M65 140v5" stroke="#9bada1"/><text x="65" y="160" text-anchor="middle" >3</text><path d="M150 140v5" stroke="#9bada1"/><text x="150" y="160" text-anchor="middle" >4</text><path d="M235 140v5" stroke="#9bada1"/><text x="235" y="160" text-anchor="middle" >5</text><path d="M320 140v5" stroke="#9bada1"/><text x="320" y="160" text-anchor="middle" >6</text><path d="M405 140v5" stroke="#9bada1"/><text x="405" y="160" text-anchor="middle" >7</text><text x="240" y="48" text-anchor="middle" >One dot per equally likely sample</text><text x="240" y="198" text-anchor="middle" >Sample mean, x̄</text></svg>